name: Bicep Lint

on:
  pull_request:
    paths:
      - "infra/**"
      - "bicepconfig.json"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "bicepconfig.json"
      - "scripts/**"

permissions:
  contents: read

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure CLI version
        run: az version

      - name: Bicep version
        run: az bicep version

      - name: Lint Bicep files
        run: |
          set -euo pipefail
          mapfile -t files < <(find infra -type f -name "*.bicep")
          for file in "${files[@]}"; do
            echo "Linting $file"
            az bicep lint --file "$file"
          done

      - name: Build Bicep files
        run: |
          set -euo pipefail
          mapfile -t files < <(find infra -type f -name "*.bicep")
          for file in "${files[@]}"; do
            echo "Building $file"
            az bicep build --file "$file" --stdout > /dev/null
          done

  powershell-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyse PowerShell scripts
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1 -Severity Warning, Error
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)."
          }
