name: Bicep Lint

on:
  pull_request:
    paths:
      - "infra/**"
      - "bicepconfig.json"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - "infra/**"
      - "bicepconfig.json"
      - "scripts/**"

env:
  AZURE_CLI_VERSION: "2.75.0"

jobs:
  lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Azure CLI
        run: |
          set -euo pipefail
          curl -sL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y "azure-cli=${AZURE_CLI_VERSION}-1~$(lsb_release -cs)"

      - name: Bicep version
        run: az bicep version

      - name: Lint Bicep files
        run: |
          set -euo pipefail
          mapfile -t files < <(find infra -type f -name "*.bicep")
          for file in "${files[@]}"; do
            echo "Linting $file"
            az bicep lint --file "$file"
          done

      - name: Build Bicep files
        run: |
          set -euo pipefail
          mapfile -t files < <(find infra -type f -name "*.bicep")
          for file in "${files[@]}"; do
            echo "Building $file"
            az bicep build --file "$file" --stdout > /dev/null
          done

  powershell-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyse PowerShell scripts
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning, Error
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)."
          }
